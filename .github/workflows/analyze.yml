name: Analyze addons

on:
  schedule:
    # Mondays 06:00 UTC — the addon cache expires weekly, so each run lands a fresh snapshot
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**"]

permissions:
  contents: write # committing history/ snapshots
  pages: write # deploying the report
  id-token: write # OIDC handshake for deploy-pages

# One run at a time so a manual dispatch can't race the weekly push
concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Downloads the full addon corpus and resolves theme @imports, so it needs
      # network and takes a few minutes. A store-API hiccup fails the run; the
      # snapshot cadence tolerates that — rerun via workflow_dispatch or wait a week.
      - run: bun run analyze

      # Snapshots are keyed by the cache's data date, so re-runs against unchanged
      # data produce no diff and this commit step is a no-op.
      - name: Commit history snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -m "chore: weekly analysis snapshot" && git push)

      - name: Stage report for Pages
        run: mkdir -p _site && cp results/report.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
