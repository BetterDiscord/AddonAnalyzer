name: Analyze addons

on:
  schedule:
    # Mondays 06:00 UTC — the addon cache expires weekly, so each run lands a fresh snapshot
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**"]

permissions:
  contents: write # committing history/ snapshots
  pages: write # deploying the report
  id-token: write # OIDC handshake for deploy-pages

# One run at a time so a manual dispatch can't race the weekly push
concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Pin the addon corpus for the ISO week (weeks start Monday, same as the cron):
      # the Monday run misses, downloads fresh, and saves; later runs that week reuse
      # it, so their snapshots carry the same dataDate and identical data — matching
      # how the local weekly cache behaves. Eviction just means one extra download.
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: addon-corpus-${{ steps.week.outputs.week }}

      # On a cache miss this downloads the full corpus AND fetches every theme's remote
      # @import graph into .cache/imports (both covered by the cache above). On a cache
      # hit the run is offline apart from retrying any addon that failed to download:
      # updateImports() is gated on the corpus dataDate, and fillGaps() only touches the
      # sources with no copy on disk. A dead addon source is annotated, not fatal, until
      # more than min(5, 2%) are missing; only a store-list failure fails the run outright
      # (rerun via workflow_dispatch or wait a week).
      - run: bun run analyze

      # With the corpus cached, a mid-week push produces the same snapshot and this
      # would no-op — but the gate still matters for two cases: a push that changes
      # analysis code (same dataDate, different numbers — it must not silently rewrite
      # the committed Monday snapshot) and a cache eviction (fresh download stamps the
      # push day, an off-cadence dataDate). Only cron and a deliberate manual dispatch
      # (e.g. recovering a failed Monday) persist history; push runs just redeploy.
      - name: Commit history snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -m "chore: weekly analysis snapshot" && git push)

      - name: Stage report for Pages
        run: mkdir -p _site && cp results/report.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
